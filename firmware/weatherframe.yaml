# E-paper weather frame — device firmware for the custom ESP32-S3 board.
#   esphome run weatherframe.yaml          (first time over USB-C, later OTA in MAINT mode)
#
# Wake cycle (every 15 min, aligned to :00/:15/:30/:45):
#   boot -> read SHT40 + battery -> Wi-Fi -> Open-Meteo -> refresh e-paper -> deep sleep
# MAINT switch ON keeps the board awake for OTA and logs. The button forces a refresh.

substitutions:
  name: weatherframe
  location_name: "Budapest"
  latitude: "47.4979"
  longitude: "19.0402"
  german: "true"          # "false" for English labels
  fahrenheit: "false"     # "true" for °F / mph
  interval_s: "900"       # wake interval in seconds
  quiet_start: "0"        # no updates from 00:00 ...
  quiet_end: "6"          # ... until 06:00 local time (set both equal to disable)
  low_battery_v: "3.40"

  # Pin map (must match hardware/kicad/weatherframe)
  pin_sda: GPIO16
  pin_scl: GPIO17
  pin_vbus: GPIO4
  pin_vbat: GPIO5
  pin_epd_pwr: GPIO6      # low = HAT powered (P-FET gate)
  pin_epd_busy: GPIO7
  pin_epd_rst: GPIO8
  pin_epd_dc: GPIO9
  pin_epd_cs: GPIO10
  pin_epd_mosi: GPIO11
  pin_epd_clk: GPIO12
  pin_button: GPIO13
  pin_maint: GPIO14
  pin_chg: GPIO15

esphome:
  name: ${name}
  friendly_name: Weather Frame
  on_boot:
    priority: -100
    then:
      - script.execute: wake_cycle

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

packages:
  common: !include weatherframe/common.yaml

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 0s
  power_save_mode: light
  # A static IP saves ~1 s of DHCP per wake. Uncomment and adjust:
  # manual_ip:
  #   static_ip: 192.168.1.60
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  #   dns1: 192.168.1.1

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: sntp
    id: wf_clock

deep_sleep:
  id: sleeper
  sleep_duration: 15min
  run_duration: 90s       # safety net: never stay awake longer than this (unless MAINT)
  wakeup_pin:
    number: ${pin_button}
    inverted: true        # button pulls low; external 10k pull-up on the board
    allow_other_uses: true

i2c:
  sda: ${pin_sda}
  scl: ${pin_scl}
  frequency: 400kHz

spi:
  clk_pin: ${pin_epd_clk}
  mosi_pin: ${pin_epd_mosi}

sensor:
  - platform: sht4x
    id: sht40
    update_interval: never
    precision: High
    heater_max_duty: 0
    temperature:
      id: indoor_temp
      name: Indoor temperature
    humidity:
      id: indoor_hum
      name: Indoor humidity

  - platform: adc
    id: vbat
    name: Battery voltage
    pin: ${pin_vbat}
    attenuation: 12db
    samples: 16
    update_interval: never
    filters:
      - multiply: 2.0     # 1M/1M divider

binary_sensor:
  - platform: gpio
    id: usb_power
    name: USB power
    pin: ${pin_vbus}      # VBUS via 100k/150k divider (5 V -> 3.0 V)
  - platform: gpio
    id: chg_stat
    pin: ${pin_chg}       # MCP73831 STAT via 100k/150k divider: low = charging, high = done
  - platform: template
    id: charging
    name: Charging
    lambda: return id(usb_power).state && !id(chg_stat).state;
  - platform: gpio
    id: maint
    name: Maintenance switch
    pin:
      number: ${pin_maint}
      inverted: true      # switch to GND = maintenance
      mode:
        input: true
        pullup: true
    on_press:
      - deep_sleep.prevent: sleeper
    on_release:
      - deep_sleep.allow: sleeper
  - platform: gpio
    id: button
    name: Refresh button
    pin:
      number: ${pin_button}
      inverted: true
      allow_other_uses: true
    on_press:
      - script.execute: wake_cycle

display:
  - platform: epaper_spi
    id: epd
    model: waveshare-7.5in-v2
    cs_pin: ${pin_epd_cs}
    dc_pin: ${pin_epd_dc}
    reset_pin: ${pin_epd_rst}
    busy_pin:
      number: ${pin_epd_busy}
      inverted: true      # UC8179 BUSY is low while busy
    enable_pin:
      number: ${pin_epd_pwr}
      inverted: true      # drives the P-FET gate low = HAT on
    update_interval: never
    lambda: ${render_lambda}

script:
  - id: wake_cycle
    mode: single
    then:
      - if:
          condition:
            binary_sensor.is_on: maint
          then:
            - deep_sleep.prevent: sleeper
      # Read the room before Wi-Fi and the regulator warm the board up.
      - component.update: sht40
      - component.update: vbat
      - lambda: |-
          id(low_battery) = id(vbat).has_state() && id(vbat).state < ${low_battery_v} && !id(usb_power).state;
      - if:
          condition:
            lambda: return !id(low_battery);
          then:
            - wait_until:
                condition:
                  wifi.connected:
                timeout: 15s
            - if:
                condition:
                  wifi.connected:
                then:
                  - wait_until:
                      condition:
                        lambda: return id(wf_clock).now().is_valid();
                      timeout: 3s
                  - script.execute: fetch_weather
                  - script.wait: fetch_weather
      - component.update: epd
      - delay: 200ms
      - wait_until:
          condition:
            lambda: return id(epd).is_idle();
          timeout: 30s
      - if:
          condition:
            binary_sensor.is_off: maint
          then:
            - deep_sleep.enter:
                id: sleeper
                # Low battery: only wake for the button or to re-check every 6 h.
                sleep_duration: !lambda |-
                  if (id(low_battery)) return 6u * 3600u * 1000u;
                  auto now = id(wf_clock).now();
                  return wf::next_sleep_ms(now.is_valid() ? now.timestamp : 0,
                                           ${interval_s}, ${quiet_start}, ${quiet_end});
